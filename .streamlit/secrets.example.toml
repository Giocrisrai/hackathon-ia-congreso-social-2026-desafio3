# Plantilla de secrets · Desafío 3
# Copiar en Streamlit Cloud → Settings → Secrets (o en .streamlit/secrets.toml para probar en local).
# NUNCA subir el archivo con claves reales a GitHub.

# ── Equipos: un bloque por equipo ─────────────────────────────
[equipos.E01]
nombre = "Equipo 01"
clave = "cambiar-clave-01"

[equipos.E02]
nombre = "Equipo 02"
clave = "cambiar-clave-02"

# ── Mentores: código MXX, con cuota propia y diagnóstico de la IA ──
[equipos.M01]
nombre = "Mentor · Nombre"
clave = "cambiar-clave-m01"

# ── IA: se prueban en este orden; si uno falla o se satura, pasa al siguiente ──
[ia]
orden = ["groq", "mistral"]
limite_consultas_por_equipo = 120
# razonamiento = "medium"   # gpt-oss: "medium" respeta mejor el tono de la planilla; "low" gasta menos cuota

[ia.groq]
api_key = "gsk_..."
modelos = ["openai/gpt-oss-120b", "openai/gpt-oss-20b"]

[ia.mistral]
api_key = "..."
modelos = ["mistral-small-latest", "ministral-8b-latest"]

# Para sumar otro proveedor: agregar su nombre al final de `orden` y su bloque.
# Ya traen dirección: groq, mistral, openai, gemini, openrouter, cerebras, together, deepseek.
# [ia.cerebras]
# api_key = "csk-..."
# modelos = ["gpt-oss-120b"]
#
# [ia.gemini]
# api_key = "AIza..."
# modelos = ["gemini-2.5-flash"]
#
# Otro proveedor compatible con OpenAI:
# [ia.otro]
# api_key = "..."
# url = "https://.../v1"
# modelos = ["nombre-del-modelo"]

# ── Opcionales ────────────────────────────────────────────────
# MODO_DEMO = "si"            # fuerza respuestas de demostración (contingencia sin IA)
# REGISTRO_FORM_URL = "..."   # Google Form donde se registran las consultas; sin él, el registro
#                             # queda en la app y se descarga desde la barra lateral
